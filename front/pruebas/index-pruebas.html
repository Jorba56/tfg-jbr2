<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banco de Pruebas: Versus Screen</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="test-controls">
    <h3>BANCO DE PRUEBAS: PANTALLA VERSUS</h3>
    <button onclick="simularCargaPartida()" class="btn-test">▶ SIMULAR CARGA DE PARTIDA</button>
    <p>Abre las herramientas de desarrollador (F12) y pon la vista de móvil para probar el CSS.</p>
</div>

<div id="versus-overlay" class="versus-overlay" style="display: none;">
    <div class="v-line left-line"></div>
    <div class="v-line right-line"></div>

    <div class="player-card host-side">
        <h2 id="vs-host-name">JORGE_99</h2>
        <div class="vs-avatar" id="vs-host-avatar">
            <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Jorge_99&top=shortHair" class="avatar-img host-glow">
        </div>
    </div>

    <div class="vs-center">
        <div class="vs-circle">VS</div>
    </div>

    <div class="player-card guest-side">
        <h2 id="vs-guest-name">RIVAL_MISTERIOSO</h2>
        <div class="vs-avatar" id="vs-guest-avatar">
            <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Rival_Misterioso&top=longHair&accessories=sunglasses" class="avatar-img guest-glow">
        </div>
    </div>

    <div id="vs-countdown" class="vs-countdown"></div>
</div>

<script>
    // Simulador de la animación (Copia exacta de game.js adaptada para pruebas)
    function simularCargaPartida() {
        const overlay = document.getElementById('versus-overlay');
        overlay.style.display = 'flex';

        setTimeout(() => {
            overlay.classList.add('vs-active');
        }, 50);

        let contador = 300;
        const countDOM = document.getElementById('vs-countdown');
        countDOM.innerText = contador;
        countDOM.style.color = "#fff";

        const intervalo = setInterval(() => {
            contador--;
            if (contador > 0) {
                countDOM.innerText = contador;
                countDOM.style.transform = 'translateX(-50%) scale(1.5)';
                setTimeout(() => {
                    // 🚨 AQUÍ TAMBIÉN: Al volver al tamaño normal, mantenemos el centrado
                    countDOM.style.transform = 'translateX(-50%) scale(1)';
                }, 150);
            } else if (contador === 0) {
                countDOM.innerText = "¡ACELERA!";
                countDOM.style.color = "var(--primary)"; // Cyan
            } else {
                clearInterval(intervalo);
                overlay.classList.remove('vs-active');

                setTimeout(() => {
                    overlay.style.display = 'none';
                    countDOM.innerText = "";
                }, 500);
            }
        }, 1000);
    }
</script>
</body>
</html>
