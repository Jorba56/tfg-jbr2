<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios y Roles</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
            window.addEventListener('DOMContentLoaded', () => document.body.classList.add('light-mode'));
        }
    </script>

    <style>
        body {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            transition: 0.3s;
            /* ESTAS TRES LÍNEAS ARREGLAN EL DESASTRE VISUAL: */
            display: block !important;
            height: auto !important;
            overflow-y: auto !important;
        }

        /* Transformamos los fondos blancos de Tailwind en tus fondos dinámicos */
        .bg-white, .bg-gray-50, .bg-blue-900 { background-color: var(--card-bg) !important; }

        /* Transformamos los textos grises en tu texto dinámico */
        .text-gray-800, .text-gray-700, .text-gray-600, .text-gray-500 { color: var(--text) !important; }
        .border-gray-200, .border-gray-300, .border-gray-100 { border-color: var(--text-secondary) !important; }

        /* Tablas adaptativas */
        thead th { background-color: rgba(0,0,0,0.2) !important; color: var(--primary) !important; }
        tbody tr { border-bottom: 1px solid var(--text-secondary) !important; }
        tbody tr:hover { background-color: rgba(255, 255, 255, 0.05) !important; }
        body.light-mode tbody tr:hover { background-color: rgba(0, 0, 0, 0.05) !important; }

        /* Inputs y buscadres dinámicos */
        input[type="text"], input[type="number"], input[type="email"] {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            border: 1px solid var(--text-secondary) !important;
        }
        input:focus { border-color: var(--primary) !important; outline: none; }

        input, button { margin: 0 !important; } /* Quita los márgenes gruesos del login */

        /* Solo se aplica en pantallas de ordenador o tablet grande */
        @media (min-width: 768px) {
            button {
                width: auto !important; /* Quita el 94% de ancho forzado por el juego */
                padding: 8px 16px !important; /* Botones más finos y elegantes */
            }

            /* Excepción para los iconos de la tabla, que deben seguir siendo pequeños */
            td button { padding: 5px !important; background: transparent !important; }

            /* Ajustar barras de búsqueda para que sean estilizadas */
            input[type="text"], input[type="number"], input[type="email"] {
                padding: 8px 16px !important;
                height: 40px !important;
            }
            #inputBusquedaId { width: 120px !important; }
            #inputBusquedaCorreo { width: 280px !important; }
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen">

<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
    <div>
        <h2 class="text-2xl font-bold theme-strong">Centro de Control</h2>
        <p class="theme-text text-sm mt-1">Administra los accesos y roles de la plataforma.</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
        <button onclick="window.location.href='index.html'" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded-lg shadow transition flex items-center justify-center w-full sm:w-auto">
            <i class="fas fa-arrow-left mr-2"></i> Volver al Juego
        </button>

        <div class="flex theme-card rounded-lg shadow-sm border theme-border p-1 w-full sm:w-auto justify-center">
            <button onclick="cambiarPestana('usuarios')" id="tab-usuarios" class="px-4 md:px-6 py-2 rounded-md font-bold text-sm bg-blue-100 text-blue-700 transition w-1/2 sm:w-auto">Usuarios</button>
            <button onclick="cambiarPestana('roles')" id="tab-roles" class="px-4 md:px-6 py-2 rounded-md font-bold text-sm theme-text hover:bg-gray-500/10 transition w-1/2 sm:w-auto">Roles</button>
        </div>
    </div>
</div>

<div id="seccion-usuarios" class="block">
    <div class="theme-card p-4 rounded-lg shadow-md mb-6 flex flex-col md:flex-row justify-between items-center border-t-4 border-blue-500 gap-4">
        <div class="flex w-full md:w-auto gap-2">
            <input type="number" id="inputBusquedaId" placeholder="ID..." class="theme-input rounded px-3 py-2 w-full md:w-24">
            <button onclick="buscarUsuarioPorId()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded font-bold transition">Buscar</button>
        </div>
        <div class="flex w-full md:w-auto gap-2">
            <input type="text" id="inputBusquedaCorreo" placeholder="Correo..." class="theme-input rounded px-3 py-2 w-full md:w-48">
            <button onclick="buscarUsuarioPorCorreo()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded font-bold transition">Buscar</button>
        </div>
        <button onclick="exportarExcelUsuarios()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow transition w-full md:w-auto flex justify-center items-center">
            <i class="fas fa-file-excel mr-2"></i> Exportar
        </button>
    </div>

    <div class="theme-card shadow-md rounded-lg border theme-border overflow-hidden">
        <div class="overflow-x-auto w-full">
            <table class="min-w-full leading-normal">
                <thead class="bg-gray-900/10 theme-strong">
                <tr>
                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider">ID</th>
                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider">Usuario</th>
                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider">Email</th>
                    <th class="px-5 py-4 text-center text-xs font-bold uppercase tracking-wider">Roles</th>
                    <th class="px-5 py-4 text-center text-xs font-bold uppercase tracking-wider">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaUsuarios">
                <tr><td colspan="4" class="text-center py-8 text-blue-500 animate-pulse font-bold">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="bg-gray-900/10 px-5 py-3 border-t theme-border flex flex-col sm:flex-row justify-between items-center gap-3">
            <span id="infoPagUsuarios" class="text-xs theme-text font-bold">Página 1</span>
            <div class="flex gap-2">
                <button id="btnAntUsu" onclick="cambiarPaginaUsu(-1)" class="theme-card border theme-border theme-text px-3 py-1 rounded hover:bg-gray-500/20 disabled:opacity-50 font-bold">Anterior</button>
                <button id="btnSigUsu" onclick="cambiarPaginaUsu(1)" class="theme-card border theme-border theme-text px-3 py-1 rounded hover:bg-gray-500/20 disabled:opacity-50 font-bold">Siguiente</button>
            </div>
        </div>
    </div>
</div>

<div id="seccion-roles" class="hidden">
    <div class="theme-card p-4 rounded-lg shadow-md mb-6 flex flex-col md:flex-row justify-between items-center border-t-4 border-purple-500 gap-4">
        <h3 class="font-bold theme-strong">Roles del Sistema</h3>
        <button onclick="crearRol()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded shadow transition w-full md:w-auto flex justify-center items-center">
            <i class="fas fa-plus mr-2"></i> Nuevo Rol
        </button>
    </div>

    <div class="theme-card shadow-md rounded-lg border theme-border overflow-hidden">
        <div class="overflow-x-auto w-full">
            <table class="min-w-full leading-normal">
                <thead class="bg-gray-900/10 text-purple-500">
                <tr>
                    <th class="px-5 py-4 text-left text-xs font-bold uppercase w-24">ID</th>
                    <th class="px-5 py-4 text-left text-xs font-bold uppercase">Nombre del Rol</th>
                    <th class="px-5 py-4 text-center text-xs font-bold uppercase">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaRoles">
                <tr><td colspan="3" class="text-center py-8 text-purple-500 animate-pulse font-bold">Cargando roles...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="modalEditarUsuario" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="theme-card w-11/12 max-w-md rounded-2xl shadow-2xl overflow-hidden border theme-border">
        <div class="bg-blue-600 p-6 flex justify-between items-center">
            <h3 class="text-xl font-bold text-white"><i class="fas fa-user-edit mr-3"></i> Editar Usuario</h3>
            <button onclick="cerrarModalEditar()" class="text-white hover:text-gray-200 text-2xl font-bold transition">&times;</button>
        </div>
        <div class="p-6">
            <form id="formEditarUsuario" class="space-y-4">
                <input type="hidden" id="editUserId">
                <div>
                    <label class="block text-sm font-bold theme-text mb-1">Nombre</label>
                    <input type="text" id="editNombre" class="theme-input w-full rounded-lg px-4 py-2">
                </div>
                <div>
                    <label class="block text-sm font-bold theme-text mb-1">Apellidos</label>
                    <input type="text" id="editApellidos" class="theme-input w-full rounded-lg px-4 py-2">
                </div>
                <div>
                    <label class="block text-sm font-bold theme-text mb-1">Correo Electrónico</label>
                    <input type="email" id="editCorreo" class="theme-input w-full rounded-lg px-4 py-2">
                </div>
                <div class="flex items-center mt-6 bg-gray-500/10 p-3 rounded-lg border theme-border">
                    <input type="checkbox" id="editActivo" class="h-5 w-5 text-blue-600 rounded">
                    <label for="editActivo" class="ml-3 block text-sm font-bold theme-text">Cuenta Activa</label>
                </div>
            </form>
        </div>
        <div class="p-4 border-t theme-border flex justify-end gap-3 bg-gray-500/5">
            <button onclick="cerrarModalEditar()" class="theme-card border theme-border theme-text hover:bg-gray-500/20 font-bold py-2 px-6 rounded-lg transition">Cancelar</button>
            <button onclick="guardarEdicionUsuario()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">Guardar</button>
        </div>
    </div>
</div>

<div id="modalGestionRoles" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="theme-card rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden border theme-border">
        <div class="bg-purple-600 px-6 py-4 flex justify-between items-center">
            <h3 class="text-white font-bold text-lg"><i class="fas fa-user-tag mr-2"></i> Gestionar Roles</h3>
            <button onclick="cerrarGestionRoles()" class="text-white hover:text-gray-200 text-xl font-bold">&times;</button>
        </div>
        <div class="p-6">
            <div id="listaRolesUsuario" class="max-h-60 overflow-y-auto pr-2 space-y-2"></div>
        </div>
        <div class="px-6 py-4 flex justify-end border-t theme-border bg-gray-500/5">
            <button onclick="cerrarGestionRoles()" class="theme-card border theme-border theme-text hover:bg-gray-500/20 font-bold py-2 px-4 rounded transition">Cerrar</button>
        </div>
    </div>
</div>

<div id="modalGestionarRol" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="theme-card w-11/12 max-w-sm rounded-2xl shadow-2xl overflow-hidden border theme-border">
        <div id="cabeceraModalRol" class="bg-purple-600 p-6 flex justify-between items-center">
            <h3 id="tituloModalRol" class="text-xl font-bold text-white"><i class="fas fa-key mr-3"></i> Gestionar Rol</h3>
            <button onclick="cerrarModalRol()" class="text-white hover:text-gray-200 text-2xl font-bold transition">&times;</button>
        </div>
        <div class="p-6">
            <form id="formGestionarRol" class="space-y-4">
                <input type="hidden" id="rolId">
                <div>
                    <label class="block text-sm font-bold theme-text mb-1">Nombre del Rol</label>
                    <input type="text" id="rolNombre" class="theme-input w-full rounded-lg px-4 py-2 uppercase">
                </div>
                <div id="contenedorRolActivo" class="flex items-center mt-6 bg-gray-500/10 p-3 rounded-lg border theme-border">
                    <input type="checkbox" id="rolActivo" class="h-5 w-5 text-purple-600 rounded">
                    <label for="rolActivo" class="ml-3 block text-sm font-bold theme-text">Rol Activo</label>
                </div>
            </form>
        </div>
        <div class="p-4 border-t theme-border flex justify-end gap-3 bg-gray-500/5">
            <button onclick="cerrarModalRol()" class="theme-card border theme-border theme-text hover:bg-gray-500/20 font-bold py-2 px-6 rounded-lg transition">Cancelar</button>
            <button onclick="guardarRol()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">Guardar</button>
        </div>
    </div>
</div>

<div id="modal-creditos" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="theme-card w-11/12 max-w-sm rounded-2xl shadow-2xl overflow-hidden border theme-border">
        <div class="bg-yellow-500 p-6 flex justify-between items-center">
            <h3 class="text-xl font-bold text-white"><i class="fas fa-coins mr-3"></i> Añadir Créditos</h3>
            <button onclick="cerrarModalCreditos()" class="text-white hover:text-gray-200 text-2xl font-bold transition">&times;</button>
        </div>
        <div class="p-6 text-center">
            <p class="text-sm theme-text mb-4">Usuario: <strong id="modal-nombre-usuario" class="theme-strong text-lg block mt-1">...</strong></p>
            <input type="number" id="modal-input-cantidad" placeholder="Cantidad" class="theme-input w-full rounded-lg px-4 py-3 text-center text-xl font-bold mb-2">
        </div>
        <div class="p-4 border-t theme-border flex justify-end gap-3 bg-gray-500/5">
            <button onclick="cerrarModalCreditos()" class="theme-card border theme-border theme-text hover:bg-gray-500/20 font-bold py-2 px-6 rounded-lg transition">Cancelar</button>
            <button id="btn-confirmar-creditos" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-6 rounded-lg shadow transition">Ingresar</button>
        </div>
    </div>
</div>

<script src="gestion-usuarios.js"></script>
</body>
</html>
