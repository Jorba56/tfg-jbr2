<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FastFingers</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .registro-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            max-width: 380px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        h2 {
            color: var(--text-highlight);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-highlight);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            color: var(--text-highlight);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--btn-gradient);
            color: #000;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }

        button:hover { box-shadow: 0 0 15px var(--primary); }
        button:disabled { background: #555; cursor: not-allowed; color: #aaa; box-shadow: none; }

        .mensaje { margin-top: 15px; text-align: center; font-size: 0.9em; font-weight: 500;}

        .link-inferior { text-align: center; color: var(--text-secondary); font-size: 0.9em; margin-top: 20px;}
        .link-inferior a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .link-inferior a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="registro-container">
    <h2>Crear Cuenta</h2>
    <form id="registroForm">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" required placeholder="Tu apellido">
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required placeholder="usuario@email.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" id="btnRegistro">Registrarse</button>
        <p class="mensaje" id="mensajeError"></p>

        <p class="link-inferior">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
    </form>
</div>

<script src="registro.js"></script>
</body>
</html>
