<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Red de Seguridad</title>
    <style>
        /* Estilos Base Futuristas (Iguales que index.html) */
        body {
            font-family: 'Montserrat', 'Inter', Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 50px;
            margin-bottom: 50px;
            background-color: #18042c;
            color: #fcf40c;
        }

        /* Contenedor del Formulario */
        .registro-container {
            width: 350px;
            padding: 30px;
            background-color: rgba(24, 4, 44, 0.9); /* Un pelín más opaco */
            border: 2px solid #8c04e4;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(140, 4, 228, 0.3);
        }

        h2 { color: #fcf40c; font-weight: bold; font-size: 28px; text-align: center; margin-top: 0;}

        .form-group { margin-bottom: 20px; }

        /* Etiquetas de los inputs */
        label {
            display: block;
            margin-bottom: 8px;
            color: #fcf40c;
            font-weight: bold;
            font-size: 14px;
        }

        /* Estilos de los Inputs Futuristas */
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #18042c; /* Fondo oscuro interno */
            border: 1px solid #fcf40c; /* Borde amarillo fino */
            border-radius: 8px;
            color: #fcf40c; /* Texto amarillo */
            font-size: 15px;
            transition: all 0.3s;
        }

        /* Efecto al hacer click en el input */
        input:focus {
            outline: none;
            border-color: #8c04e4;
            box-shadow: 0 0 8px rgba(140, 4, 228, 0.5);
        }

        /* Botón Registrarse (Morado vibrante) */
        button {
            width: 100%;
            padding: 14px;
            background-color: #8c04e4;
            color: #fcf40c;
            border: 2px solid #8c04e4;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: transparent;
            border-color: #fcf40c;
        }
        button:disabled {
            background-color: #555;
            border-color: #555;
            cursor: not-allowed;
            color: #aaa;
        }

        /* Mensajes de error y éxito */
        .mensaje { margin-top: 15px; text-align: center; font-size: 0.9em; font-weight: bold; }

        /* Enlaces secundarios */
        p a { color: #fcf40c; text-decoration: underline; }
        p a:hover { color: #8c04e4; text-decoration: none;}
    </style>
</head>
<body>

<div class="registro-container">
    <h2>Crear Cuenta</h2>
    <form id="registroForm">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required placeholder="Escribe tu nombre">
        </div>
        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" required placeholder="Escribe tu apellido">
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required placeholder="email@ejemplo.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" id="btnRegistro">Registrarse</button>
        <p class="mensaje" id="mensajeError"></p>
        <p style="text-align: center; font-size: 0.9em; color: #fcf40c;">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
    </form>
</div>

<script src="registro.js"></script>
</body>
</html>
