<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - FastFingers</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* Usamos tus propias variables del :root */
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .landing-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            max-width: 400px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(10px); /* Efecto cristal de tu estilo */
        }

        h1 {
            color: var(--text-highlight);
            font-family: 'Poppins', sans-serif;
            margin-top: 0;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-main {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            text-decoration: none;
            border-radius: var(--radius);
            font-weight: 600;
            box-sizing: border-box;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-login {
            background: var(--btn-gradient);
            color: #000;
            border: none;
        }
        .btn-login:hover {
            box-shadow: 0 0 15px var(--primary);
        }

        .btn-registro {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-registro:hover {
            background: var(--primary);
            color: #000;
        }
    </style>
</head>
<body>

<div class="landing-container">
    <h1>FastFingers</h1>
    <p>Mejora tu velocidad de escritura, resuelve incidencias y equípate en la tienda.</p>

    <a href="login.html" class="btn-main btn-login">Iniciar Sesión</a>
    <a href="registro.html" class="btn-main btn-registro">Crear una cuenta</a>
</div>

</body>
</html>
