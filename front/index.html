<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a la Plataforma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Ocupa toda la altura de la pantalla */
            margin: 0;
            background-color: #f4f6f9;
        }
        .landing-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #333; margin-top: 0; }
        p { color: #666; margin-bottom: 30px; line-height: 1.5; }

        /* Estilos de los botones */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }
        .btn-login {
            background-color: #007bff;
            color: white;
            border: 2px solid #007bff;
        }
        .btn-login:hover { background-color: #0056b3; border-color: #0056b3;}

        .btn-registro {
            background-color: white;
            color: #28a745;
            border: 2px solid #28a745;
        }
        .btn-registro:hover { background-color: #28a745; color: white; }
    </style>
</head>
<body>

<div class="landing-container">
    <h1>¡Bienvenido!</h1>
    <p>Aprende, resuelve incidencias y mejora tus habilidades. ¿Qué deseas hacer hoy?</p>

    <a href="login.html" class="btn btn-login">Iniciar Sesión</a>
    <a href="registro.html" class="btn btn-registro">Crear una cuenta nueva</a>
</div>

</body>
</html>
