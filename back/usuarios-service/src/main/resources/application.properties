spring.application.name=usuarios-service
server.port=8081
server.forward-headers-strategy=framework
eureka.client.service-url.defaultZone=http://eureka-server-tfg:8761/eureka/

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=GXLpHnddCbSXhyiBlysTTMUJnqfCSvbX
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

##logs en .txt
logging.file.name=logs/logs_texto.txt
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=30

# --- SISTEMA DE COMUNICACIONES (EMAIL) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=2525
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.username=${SPRING_MAIL_USERNAME}

spring.mail.properties.mail.smtp.auth=true
# Usamos STARTTLS porque el 2525 suele comportarse como el 587
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ESTA LINEA ES CLAVE EN RAILWAY: Confia plenamente en el servidor de Google
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Para ver que está pasando exactamente en la consola de Railway
spring.mail.properties.mail.debug=true