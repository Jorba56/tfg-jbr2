spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=reactive

# ==========================================
# cors global (evita el 99% de los failed to fetch)
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ==========================================
# rutas spring boot 4 (sin espacios tras las comas)
# ==========================================

# ==========================================
# swagger
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.urls[0].name=API Usuarios
springdoc.swagger-ui.urls[0].url=/v3/api-docs/usuarios
springdoc.swagger-ui.urls[1].name=API Incidencias
springdoc.swagger-ui.urls[1].url=/v3/api-docs/incidencias

